data:
  path: data/opencode_sample.jsonl
  limit: 2000
retrieval:
  k: 5
  lambda_diversity: 0.65
  seed: 42
generation:
  provider: gemini
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  model: gemini-1.5-flash
  api_key_env: GEMINI_API_KEY
  temperature: 0.0
  max_tokens: 2048
  timeout_seconds: 60
evaluation:
  test_size: 0.20
  dev_size: 0.10
  cases_path: data/execution_cases.jsonl
  max_queries: 10
  timeout_seconds: 3
output:
  dir: results/codegen_gemini
